[project]
name = "Comfyui-UltraShape1"
version = "0.2.0"
description = "ComfyUI custom nodes for UltraShape - Image-guided 3D mesh refinement"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

dynamic = ["dependencies"]

[project.optional-dependencies]
rembg = ["rembg"]

[project.urls]
Repository = "https://github.com/jtydhr88/ComfyUI-UltraShape1"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.comfy]
PublisherId = "jtydhr88"
DisplayName = "Comfyui UltraShape1"
Icon = ""
